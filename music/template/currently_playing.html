<!DOCTYPE html>
<html>
<head>
    <title>SpotiShit</title>
    <style>
        /* Reset & body */
        body {
            margin: 0;
            font-family: 'Helvetica', sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        h1 {
            color: #1DB954;
            margin-bottom: 20px;
            font-size: 3rem;
        }

        /* User Card */
        #user-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #user-container img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        /* Track Card */
        #track-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #track-container img {
            border-radius: 10px;
            margin-bottom: 15px;
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        #track-container strong {
            font-size: 1.3rem;
        }

        #track-container p {
            margin: 8px 0;
            font-weight: 500;
        }

        /* Progress bar */
        #progress-container {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 6px;
            margin-top: 15px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #1DB954;
            border-radius: 6px;
            transition: width 0.5s linear;
        }

        /* Responsive */
        @media (max-width: 400px) {
            #track-container {
                width: 90%;
            }
            #track-container img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>

<h1>SpotiShit</h1>

<div id="user-container">
    {% if user %}
        {% if user.image %}
            <img src="{{ user.image }}" alt="User profile">
        {% endif %}
        <strong>{{ user.name }}</strong>
    {% else %}
        <p>User info not available.</p>
    {% endif %}
</div>

<div id="track-container">
    {% if track %}
        <img src="{{ track.album_image }}" alt="Album cover">
        <strong>{{ track.name }}</strong><br>
        {{ track.artist }}<br>
        <p>{{ track.is_playing|yesno:"Playing...,Paused" }}</p>
        <div id="progress-container">
            <div id="progress-bar" style="width: {{ track.progress_percent }}%"></div>
        </div>
    {% else %}
        <p>No track currently playing.</p>
    {% endif %}
</div>

<script>
let track = null;
let progress = 0;
let duration = 0;

// Fetch track info from Django
async function fetchTrack() {
    try {
        const response = await fetch("{% url 'currently_playing_json' %}");
        if (!response.ok) return;

        const data = await response.json();
        const container = document.getElementById("track-container");

        if (!data.track) {
            container.innerHTML = '<p>No track currently playing.</p>';
            track = null;
            return;
        }

        track = data.track;
        progress = track.progress_ms;
        duration = track.duration_ms;

        const progressPercent = (progress / duration) * 100;

        container.innerHTML = `
            <img src="${track.album_image}" width="200"><br>
            <strong>${track.name}</strong><br>
            ${track.artist}<br>
            <p>${track.is_playing ? 'Playing...' : 'Paused'}</p>
            <div id="progress-container">
                <div id="progress-bar" style="width:${progressPercent}%"></div>
            </div>
        `;
    } catch (err) {
        console.error("Error fetching track:", err);
    }
}

// Update the progress bar smoothly every second
function updateProgressBar() {
    if (!track || !track.is_playing) return;
    progress += 1000; // increment 1 second
    if (progress > duration) progress = duration;

    const bar = document.getElementById("progress-bar");
    if (bar) {
        const percent = (progress / duration) * 100;
        bar.style.width = percent + "%";
    }
}

// Initial fetch
fetchTrack();

// Poll every 5 seconds for latest track info
setInterval(fetchTrack, 5000);

// Smooth progress update every 1 second
setInterval(updateProgressBar, 1000);
</script>

</body>
</html>
