<!DOCTYPE html>
<html>
<head>
    <title>SpotiShit</title>
    <style>
        /* ========== GLOBAL ========== */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* ========== BLURRED BACKGROUND ========== */
        #background {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.5);
            transform: scale(1.2);
            z-index: -2;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
        }

        /* ========== USER INFO (TOP RIGHT) ========== */
        #user-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(30, 30, 30, 0.8);
            padding: 10px 14px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        #user-container img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
        }

        /* ========== MAIN CENTER AREA ========== */
        #main {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1DB954;
            font-size: 3rem;
            margin-bottom: 30px;
        }

        /* ========== TRACK CARD ========== */
        #track-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }

        #track-container img {
            width: 280px;
            height: 280px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        #track-container strong {
            font-size: 1.6rem;
        }

        #track-container .artist {
            opacity: 0.8;
            font-size: 1.1rem;
        }

        /* ========== PROGRESS BAR ========== */
        #progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #1DB954;
            transition: width 0.5s linear;
        }

        #logout-btn {
            background: transparent;
            border: 1px solid #1DB954;
            color: #1DB954;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        #logout-btn:hover {
            background: #1DB954;
            color: black;
        }

    </style>
</head>

<body>

{% if track %}
<div id="background" style="background-image: url('{{ track.album_image }}');"></div>
{% endif %}
<div id="overlay"></div>

<!-- USER INFO -->
<div id="user-container">
    {% if user %}
        {% if user.image %}
            <img src="{{ user.image }}" alt="Profile">
        {% endif %}
        <strong>{{ user.name }}</strong>
        <form action="{% url 'spotify_logout' %}" method="post" style="margin:0;">
            {% csrf_token %}
            <button id="logout-btn" type="submit">Disconnect</button>
        </form>
    {% endif %}
</div>

<!-- MAIN CONTENT -->
<div id="main">
    <h1>SpotiShit</h1>

    <div id="track-container">
        {% if track %}
            <img src="{{ track.album_image }}" alt="Album cover">
            <strong>{{ track.name }}</strong>
            <div class="artist">{{ track.artist }}</div>
            <div>{{ track.is_playing|yesno:"Playing…,Paused" }}</div>

            <div id="progress-container">
                <div id="progress-bar" style="width: {{ track.progress_percent }}%"></div>
            </div>
        {% else %}
            <p>No track currently playing.</p>
        {% endif %}
    </div>
</div>

<script>
let track = {{ track|default:'null'|safe }};
let progress = track ? track.progress_ms : 0;
let duration = track ? track.duration_ms : 0;

async function fetchTrack() {
    const response = await fetch("{% url 'currently_playing_json' %}");
    if (!response.ok) return;

    const data = await response.json();
    if (!data.track) return;

    track = data.track;
    progress = track.progress_ms;
    duration = track.duration_ms;

    document.getElementById("track-container").innerHTML = `
        <img src="${track.album_image}">
        <strong>${track.name}</strong>
        <div class="artist">${track.artist}</div>
        <div>${track.is_playing ? 'Playing…' : 'Paused'}</div>
        <div id="progress-container">
            <div id="progress-bar" style="width:${(progress/duration)*100}%"></div>
        </div>
    `;

    document.getElementById("background").style.backgroundImage =
        `url('${track.album_image}')`;
}

function updateProgressBar() {
    if (!track || !track.is_playing) return;
    progress += 1000;
    if (progress > duration) progress = duration;

    const bar = document.getElementById("progress-bar");
    if (bar) bar.style.width = ((progress / duration) * 100) + "%";
}

fetchTrack();
setInterval(fetchTrack, 5000);
setInterval(updateProgressBar, 1000);
</script>

</body>
</html>
